name: Audit runner CI

# This repository holds the runner and the research, not the findings.
# The live portfolio config is private; the scheduled audit runs in the
# private companion repo, which checks this repo out for the script.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "portfolio.example.json"
      - "scripts/geo_aeo_audit.py"
      - "tests/**"
      - ".github/workflows/geo-aeo-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-run the auditor against the example config
        run: |
          python scripts/geo_aeo_audit.py \
            --config portfolio.example.json \
            --output /tmp/smoke.json \
            --markdown /tmp/smoke.md \
            --timeout 10 || true
          test -s /tmp/smoke.json || { echo "auditor produced no output"; exit 1; }
          echo "auditor executed and produced output"
