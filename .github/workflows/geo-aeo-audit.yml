name: Audit runner CI

# This repository holds the runner and the research, not the findings.
# The live portfolio config is private; the scheduled audit runs in the
# private companion repo, which checks this repo out for the script.

on:
  workflow_dispatch:
  # Every pull request, unfiltered: the `test` job is a required status check on
  # main, and a path filter would leave docs-only pull requests blocked forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-run the auditor against the example config
        run: |
          python scripts/geo_aeo_audit.py \
            --config portfolio.example.json \
            --output /tmp/smoke.json \
            --markdown /tmp/smoke.md \
            --timeout 10 || true
          test -s /tmp/smoke.json || { echo "auditor produced no output"; exit 1; }
          echo "auditor executed and produced output"
      - name: Smoke-run the citation probe offline against saved fixtures
        run: |
          python scripts/llm_citation_probe.py \
            --config probes.example.json \
            --fixtures tests/fixtures/citation_probe \
            --output /tmp/citations.json \
            --markdown /tmp/citations.md
          test -s /tmp/citations.json || { echo "citation probe produced no output"; exit 1; }
          echo "citation probe executed offline and produced output"
